{% load fmt %}
<div class="table-wrap"><table>
<thead><tr><th>Vendedor</th><th>Meta</th><th>Vendido</th><th>Falta</th><th>%</th><th>Status</th></tr></thead>
<tbody>{% for d in diario %}<tr>
<td data-l="Vendedor">{{ d.vendedor.nome }}</td><td data-l="Meta">{{ d.meta|moeda }}</td><td data-l="Vendido">{{ d.vendido|moeda }}</td>
<td data-l="Falta">{{ d.falta|moeda }}</td><td data-l="%">{{ d.pct|perc }}</td>
<td data-l="Status"><span class="badge {{ d.status }}">{{ d.status_txt }}</span></td></tr>
{% empty %}<tr><td colspan="6">Nenhum vendedor.</td></tr>{% endfor %}</tbody></table></div>
